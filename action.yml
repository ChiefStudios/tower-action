name: Deploy via tower
description: Deploys the current ref through tower using GitHub OIDC and waits for the result.
inputs:
  url:
    description: Base URL of tower
    required: true
  timeout-minutes:
    description: How long to wait for the deploy to finish
    default: "15"
runs:
  using: composite
  steps:
    - shell: bash
      run: bash "${{ github.action_path }}/deploy.sh"
      env:
        TOWER_URL: ${{ inputs.url }}
        TOWER_TIMEOUT_MIN: ${{ inputs.timeout-minutes }}
